name: fmt-fix

# 一次性用途：在 CI 同版本 rustfmt 下全量格式化，并把结果提交回 main。
# 背景：本机 rustfmt 1.10.0 对 cli-dialects/src/{ios,lib}.rs 会挂死（超时被 kill），
# 无法本地生成与 CI 一致的结果；该工作流跑完即删除。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all
        run: cargo fmt --all

      - name: 提交格式化结果
        run: |
          if git diff --quiet; then
            echo "无改动：仓库已是 fmt 干净状态"
            exit 0
          fi
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: cargo fmt 全量格式化（修 CI 格式检查）"
          git push
